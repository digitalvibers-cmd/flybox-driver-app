// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        googlePlayServicesVersion = "+"
        playServicesLocationVersion = "21.0.1"
        firebaseMessagingVersion = "22.0.0"
        firebaseVersion = "22.0.0"
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        appCompatVersion = "1.4.2"
    }
    repositories {
        google()
        mavenCentral()

        maven {
            url "https://jitpack.io" // Or the correct repository URL for Flipper
        }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:3.5.4")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0")
        classpath('com.google.gms:google-services:4.3.15')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        maven { url 'https://developer.huawei.com/repo/' }
        // Required for react-native-background-fetch
        maven { url("${project(':react-native-background-fetch').projectDir}/libs") }

        // The legacy OSSRH host oss.sonatype.org was decommissioned and now
        // answers 504 (Gateway Time-out). Some native modules still declare it as
        // a Maven repo; a 5xx (unlike 404) aborts Gradle resolution instead of
        // falling through to the next repo, breaking the whole build. Redirect any
        // such repo to the live Central successor so release artifacts (firebase-bom,
        // annotations, …) resolve normally from google()/mavenCentral().
        all { repo ->
            if (repo instanceof MavenArtifactRepository) {
                def repoUrl = repo.url?.toString() ?: ''
                if (repoUrl.startsWith('https://oss.sonatype.org/content/repositories/snapshots')) {
                    repo.url = 'https://central.sonatype.com/repository/maven-snapshots/'
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"